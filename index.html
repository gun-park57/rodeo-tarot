    Object.entries(G).forEach(([k, g]) => { [g.stem, g.branch].forEach(x => { if (SAJU.tenGods[x]) godCount[x] = (godCount[x] || 0) + 1; }); });
    const topGods = Object.entries(godCount).sort((a, b) => b[1] - a[1]).slice(0, 2);
    const ST = SAJU.stems[P.day.stem];
    const yb = P.year.branch;
    const nowAge = new Date().getFullYear() - Number(dateStr.slice(0, 4)) + 1;
    const curDu = du.list.filter(x => x.startAge <= nowAge).pop();
    const duHtml = du.list.map(x => `<div class="du ${x === curDu ? 'cur' : ''}"><div class="pos">${x.startAge}세~</div>
      <div class="han">${x.han[0]}<br>${x.han[1]}</div><div class="god">${esc(x.stemGod)}<br>${esc(x.branchGod)}</div><div class="stage">${esc(x.stage)}</div></div>`).join('');
    const relHtml = r.relations.length
      ? r.relations.map(x => `<p>• <b>${esc(x.where)} ${esc(x.ko)} ${esc(x.type)}</b> — ${esc(REL_MEAN[x.type] || '')}</p>`).join('')
      : '<p>• 기둥끼리 크게 부딪히거나 묶이는 관계가 없어요.</p>';
    const ssHtml = r.shinsal.length
      ? r.shinsal.map(x => `<p>• <b>${esc(x.name)}</b> (${esc(x.at)}주) — ${esc(SAJU.shinsal.meaning[x.name])}</p>`).join('')
      : '<p>• 역마·도화·화개·천을귀인이 원국에 드러나지 않아요.</p>';
    const html = `
      <div class="result-title">${esc(name)}님의 사주 원국</div>
      <div class="pillars">${cell('hour', '시주')}${cell('day', '일주 (나)')}${cell('month', '월주')}${cell('year', '연주')}</div>
      <p class="muted" style="text-align:center;margin:-6px 0 12px">가운데 = 십신 · 맨 아래 = 12운성</p>
      <div class="rc">
        <p><b>일간 ${STEMS[P.day.stem]}${EL[STEM_EL[P.day.stem]]} · ${esc(ST.image)}</b> — ${esc(ST.trait)}</p>
        <p>• 연애: ${esc(ST.love)}</p><p>• 잘 맞는 일: ${esc(ST.work)}</p>
        <p class="lbl" style="margin-top:12px">오행 분포</p>
        <div class="bars">${bars}</div>
        ${strong.concat(weak).map(t => `<p>• ${t}</p>`).join('') || '<p>• 오행이 비교적 고르게 분포되어 있어요.</p>'}
        <p class="lbl" style="margin-top:12px">두드러진 십신</p>
        ${topGods.map(([g, n]) => { const T = SAJU.tenGods[g]; return `<p>• <b>${g}</b> ${n}개 (${esc(T.core)}) — ${esc(T.good)} 다만 ${esc(T.bad)} <span class="muted">타로: ${esc(T.tarot)}</span></p>`; }).join('')}
        ${lockable('saju', `<p class="lbl" style="margin-top:12px">합·충·형·파·해</p>${relHtml}
        <p class="lbl" style="margin-top:12px">신살</p>${ssHtml}
        <p class="lbl" style="margin-top:12px">대운 (10년 단위 · ${du.forward ? '순행' : '역행'} · 대운수 ${du.num})</p>
        <div class="du-row">${duHtml}</div>
        ${curDu ? `<p>• 지금은 <b>${curDu.ko} 대운</b>(${curDu.startAge}세~): ${esc(curDu.stemGod)}·${esc(curDu.branchGod)}의 10년. ${esc(SAJU.tenGods[curDu.stemGod].core)}이 앞 5년, ${esc(SAJU.tenGods[curDu.branchGod].core)}이 뒤 5년의 주제예요.</p>` : `<p>• 첫 대운(${du.num}세) 전이에요.</p>`}`, `<p class="lbl" style="margin-top:12px">대운 (10년 단위)</p><div class="du-row blur">${duHtml}</div><p>• 지금 대운과 합·충·신살 풀이는 잠겨 있어요.</p>`)}
        <p class="lbl" style="margin-top:12px">띠와 타로</p>
        <p>• ${r.sajuYear}년 기준 <b>${BRANCHES[yb]}(${ANIMALS[yb]})띠</b> · 타로 매칭 <b>${BRANCH_TAROT[yb]}</b> — ${BRANCH_USE[yb]}</p>
        ${r.nearBoundary ? `<p class="muted">⚠️ 절기(${r.termName || '절입'}) 경계 근처에 태어나셨어요. 월주가 달라질 수 있으니 출생 시각을 정확히 확인해 주세요.</p>` : ''}
        ${r.tz.foreign ? `<p class="muted">해외 출생이라 ${esc(CITIES[city].name)} 시간대(${r.tz.tz}${r.tz.dst ? ', 서머타임' : ''})를 반영하고, 그 도시 경도 기준 실제 태양시로 시주를 정했어요.</p>` : ''}
        ${r.tz.dst && !r.tz.foreign ? '<p class="muted">출생일이 서머타임 시행 기간이라 1시간을 빼서 계산했어요.</p>' : ''}
        ${!r.tz.foreign && r.tz.base === 8.5 ? '<p class="muted">1954~1961년은 표준시가 UTC+8:30이어서 30분 보정을 하지 않았어요.</p>' : ''}
        ${!r.known ? '<p class="muted">시간을 모르면 시주 없이 세 기둥으로 봐요.</p>' : ''}
      </div>
      <div class="result-title" style="margin-top:18px">${$('sj-year').value}년 토정비결</div>
      ${tojeongHtml(dateStr, Number($('sj-year').value))}`;
    $('sj-result').innerHTML = html;
    $('sj-result').style.display = 'block';
    bindLocks(() => $('sj-go').click());
  });

  /* ---------- 점성술 ---------- */
  const cityOptions = () => `<optgroup label="국내">${Object.entries(CITIES).filter(([, c]) => !c.tz).map(([k, c]) => `<option value="${k}">${c.name}</option>`).join('')}</optgroup>
    <optgroup label="해외">${Object.entries(CITIES).filter(([, c]) => c.tz).sort((a, b) => a[1].name.localeCompare(b[1].name, 'ko')).map(([k, c]) => `<option value="${k}">${c.name} (${c.country})</option>`).join('')}</optgroup>`;
  $('as-city').innerHTML = cityOptions();
  if ($('sj-city')) $('sj-city').innerHTML = cityOptions();
  $('as-notime').addEventListener('change', e => { $('as-time').disabled = e.target.checked; });
  $('as-go').addEventListener('click', () => {
    const dateStr = $('as-date').value;
    if (!dateStr) { alert('생년월일을 선택해 주세요.'); return; }
    const timeStr = $('as-notime').checked ? '' : $('as-time').value;
    if (!timeStr && !$('as-notime').checked) { alert('출생 시각을 입력하거나 "시간 모름"을 선택해 주세요.'); return; }
    const c = natalChart(dateStr, timeStr, $('as-city').value);
    const AC = AX.chart(dateStr, timeStr, $('as-city').value), AR = AX.report(AC);
    const s = signOf(c.sun), m = signOf(c.moon);
    const a = c.known ? signOf(c.asc) : null;
    const box = (k, sign, deg, sub) => `<div><div class="k">${k}</div><div class="v">${sign === null ? '?' : SIGNS[sign]}</div><div class="s">${sub}</div></div>`;
    const houseLine = (label, lon) => c.known
      ? `<p>• ${label}은 <b>${c.houseOf(lon)}하우스</b>(${HOUSE_THEME[c.houseOf(lon) - 1]})에 있어요.</p>` : '';
    const html = `
      <div class="result-title">출생 차트 · 빅 3</div>
      <div class="big3">
        ${box('☉ 태양', s, 0, `${degIn(c.sun)}° · ${SIGN_ELEMENT[s]}`)}
        ${box('☽ 달', m, 0, `${degIn(c.moon)}° · ${SIGN_ELEMENT[m]}${c.moonUncertain ? ' (?)' : ''}`)}
        ${box('ASC 상승', a, 0, c.known ? `${degIn(c.asc)}° · ${SIGN_ELEMENT[a]}` : '시간 필요')}
      </div>
      <div class="rc">
        <p><b>태양 ${SIGNS[s]}</b> · 겉으로 드러나는 나 — ${SIGN_TRAIT[s]}. (${SIGN_ELEMENT[s]} · ${SIGN_MODE[s]} · 수호성 ${SIGN_RULER[s]})</p>
        <p><b>달 ${SIGNS[m]}</b> · 속마음과 감정 — ${SIGN_TRAIT[m]}.</p>
        ${c.moonUncertain ? '<p class="muted">태어난 날 달이 별자리를 옮겨갔어요. 시간을 알면 달 별자리가 정확해져요.</p>' : ''}
        ${c.known ? `<p><b>상승 ${SIGNS[a]}</b> · 첫인상과 삶을 대하는 태도 — ${SIGN_TRAIT[a]}.</p>` : '<p class="muted">출생 시각을 알면 상승궁과 12하우스를 계산할 수 있어요.</p>'}
        ${c.tz.dst ? '<p class="muted">서머타임 기간 출생이라 1시간을 반영했어요.</p>' : ''}
      </div>
      <div class="rc ax">${AR.free}
        ${lockable('astro', AR.paid, AR.teaser)}
        <p class="muted">출생지: ${c.city.name} · 하우스: 홀 사인 · 행성 위치: astronomy-engine</p>
      </div>`;
    $('as-result').innerHTML = html;
    $('as-result').style.display = 'block';
    bindLocks(() => $('as-go').click(), '#as-result');
  });

  /* ---------- 궁합 ---------- */
  let cmode = 'zodiac';
  const fillCompat = () => {
    const opts = cmode === 'zodiac'
      ? SIGNS.map((n, i) => `<option value="${i}">${n}</option>`).join('')
      : BRANCHES.map((b, i) => `<option value="${i}">${ANIMALS[i]}띠 (${b})</option>`).join('');
    $('cp-a').innerHTML = opts; $('cp-b').innerHTML = opts;
    $('cp-result').style.display = 'none';
  };
  document.querySelectorAll('[data-cmode]').forEach(b => b.addEventListener('click', () => {
    cmode = b.dataset.cmode;
    document.querySelectorAll('[data-cmode]').forEach(x => x.classList.toggle('on', x === b));
    fillCompat();
  }));
  fillCompat();

  // 별자리 각도 관계 (두 별자리 사이 칸 수)
  const ZODIAC_REL = {
    0: { score: 76, badge: '닮은꼴', color: '#B9927A', title: '같은 별자리 · 거울 같은 관계', text: '말하지 않아도 통하지만, 단점도 똑같이 닮아 부딪힐 때는 물러서지 않아요.' },
    1: { score: 61, badge: '어색한 이웃', color: '#8E7F74', title: '30° · 세미섹스타일', text: '바로 옆 별자리라 원소가 달라 리듬이 엇갈려요. 서로 모르는 면을 배우는 관계예요.' },
    2: { score: 84, badge: '좋은 궁합', color: '#C9A46A', title: '60° · 섹스타일', text: '불과 공기, 흙과 물처럼 서로를 돕는 원소예요. 편안한 친구에서 연인으로 자연스럽게 이어져요.' },
    3: { score: 57, badge: '긴장 관계', color: '#E08A78', title: '90° · 스퀘어', text: '같은 모달리티끼리 원소가 충돌해요. 마찰이 잦지만, 그 마찰이 서로를 성장시키는 추진력이 돼요.' },
    4: { score: 93, badge: '최고의 궁합', color: '#E2C48F', title: '120° · 트라인', text: '같은 원소끼리 만난 가장 조화로운 각도예요. 노력하지 않아도 흐름이 맞아요. 너무 편해서 긴장감이 떨어지는 것만 조심하세요.' },
    5: { score: 52, badge: '엇박자', color: '#8E7F74', title: '150° · 퀸컹스', text: '원소도 모달리티도 달라요. 계속 조율이 필요한 관계로, 맞춰가려는 의지가 관건이에요.' },
    6: { score: 80, badge: '강한 끌림', color: '#B9927A', title: '180° · 어포지션', text: '정반대 별자리라 강하게 끌리지만, 그만큼 대립도 커요. 서로의 부족한 반쪽을 채우는 관계예요.' }
  };
  // 띠 궁합 관계 판정
  const SAMHAP = [[8, 0, 4], [11, 3, 7], [2, 6, 10], [5, 9, 1]];
  const YUKHAP = [[0, 1], [2, 11], [3, 10], [4, 9], [5, 8], [6, 7]];
  const CHUNG = [[0, 6], [1, 7], [2, 8], [3, 9], [4, 10], [5, 11]];
  const WONJIN = [[0, 7], [1, 6], [2, 9], [3, 8], [4, 11], [5, 10]];
  const HAE = [[0, 7], [1, 6], [2, 5], [3, 4], [8, 11], [9, 10]];
  const HYUNG = [[2, 5], [5, 8], [2, 8], [1, 10], [10, 7], [1, 7], [0, 3]];
  const has = (list, a, b) => list.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
  function ttiRelations(a, b) {
    const r = [];
    if (a === b) r.push('same');
    if (SAMHAP.some(g => g.includes(a) && g.includes(b)) && a !== b) r.push('samhap');
    if (has(YUKHAP, a, b)) r.push('yukhap');
    if (has(CHUNG, a, b)) r.push('chung');
    if (has(WONJIN, a, b)) r.push('wonjin');
    if (has(HAE, a, b)) r.push('hae');
    if (has(HYUNG, a, b) || (a === b && [4, 6, 9, 11].includes(a))) r.push('hyung');
    return r;
  }
  const TTI_REL = {
    samhap: { s: 18, name: '삼합', text: '셋이 모여 한 오행을 이루는 가장 좋은 합이에요. 같은 목표를 향해 힘을 합쳐요.' },
    yukhap: { s: 14, name: '육합', text: '둘이 짝을 이루는 합이에요. 서로 부족한 것을 채워 안정적인 관계가 돼요.' },
    same: { s: 4, name: '같은 띠', text: '성향이 비슷해 잘 통하지만 고집도 같아 양보가 어려워요.' },
    chung: { s: -20, name: '상충', text: '정면으로 부딪히는 관계예요. 가치관과 속도가 달라 다툼이 잦아요. 역할을 나누고 서로의 영역을 인정해야 오래 가요.' },
    wonjin: { s: -14, name: '원진', text: '이유 없이 서로 거슬리고, 가까워질수록 서운함이 쌓여요. 서운한 건 그때그때 말로 풀어야 해요.' },
    hae: { s: -8, name: '상해', text: '서로 의도치 않게 손해를 끼치기 쉬워요. 돈 거래와 중요한 약속은 분명히 해두세요.' },
    hyung: { s: -10, name: '상형', text: '자존심과 기세가 부딪히며 상처를 주고받기 쉬워요. 지적보다 인정을 먼저 하세요.' }
  };

  $('cp-go').addEventListener('click', () => {
    const a = Number($('cp-a').value), b = Number($('cp-b').value);
    let score, badge, color, title, body;
    if (cmode === 'zodiac') {
      const d = Math.min(Math.abs(a - b), 12 - Math.abs(a - b));
      const R = ZODIAC_REL[d];
      score = R.score; badge = R.badge; color = R.color; title = R.title;
      body = `<p>${SIGNS[a]}(${SIGN_ELEMENT[a]}·${SIGN_MODE[a]}) × ${SIGNS[b]}(${SIGN_ELEMENT[b]}·${SIGN_MODE[b]})</p><p>${R.text}</p>
        <p class="muted">태양 별자리만 본 간이 궁합이에요. 두 사람의 금성·화성·달까지 보는 정밀 궁합은 다음 버전에서 제공해요.</p>`;
    } else {
      const rel = ttiRelations(a, b);
      score = Math.max(30, Math.min(97, 70 + rel.reduce((s, k) => s + TTI_REL[k].s, 0)));
      const good = rel.some(k => ['samhap', 'yukhap'].includes(k)), bad = rel.some(k => ['chung', 'wonjin', 'hae', 'hyung'].includes(k));
      badge = good && !bad ? '좋은 궁합' : bad && !good ? '주의할 궁합' : good && bad ? '애증 궁합' : '무난한 궁합';
      color = good && !bad ? '#C9A46A' : bad && !good ? '#E08A78' : good && bad ? '#B9927A' : '#8E7F74';
      title = `${ANIMALS[a]}띠 × ${ANIMALS[b]}띠`;
      body = (rel.length ? rel.map(k => `<p>• <b>${TTI_REL[k].name}</b> — ${TTI_REL[k].text}</p>`).join('')
        : '<p>• 특별한 합이나 충이 없는 무난한 관계예요. 관계의 질은 두 사람의 노력에 달려 있어요.</p>')
        + '<p class="muted">태어난 해의 띠만 본 간이 궁합이에요. 일주와 오행까지 보는 사주 궁합은 다음 버전에서 제공해요.</p>';
    }
    $('cp-result').innerHTML = `
      <div class="score" style="background:conic-gradient(${color} 0% ${score}%, rgba(243,236,228,0.08) ${score}% 100%)"><div class="in">${score}점</div></div>
      <div style="text-align:center"><span class="badge" style="background:${color};color:#1B1014">${badge}</span>
      <p style="font-size:15px;color:var(--gold-primary);font-weight:700;margin:0 0 10px">${esc(title)}</p></div>
      <div class="rc">${body}</div>`;
    $('cp-result').style.display = 'block';
  });
})();

</script>
<script type="module">
/* =========================================================
 * 관상·손금 (기기 안에서만 분석, 서버 전송 없음)
 *  - 관상: MediaPipe Face Landmarker 478점 → 3정(상정·중정·하정) 비율, 얼굴 가로세로 비율
 *  - 손: MediaPipe Hand Landmarker 21점 → 손바닥 모양·손가락 길이 → 4원소 손 유형
 *  - 손금 선(생명선·두뇌선·감정선) 자동 인식은 아직 지원하지 않음
 * ========================================================= */
const MP_VER = '0.10.14';
const MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const $ = id => document.getElementById(id);
const escH = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let mode = 'face';
let vision = null, faceLM = null, handLM = null, objUrl = null;

const status = t => { $('vs-status').textContent = t; };

document.querySelectorAll('[data-vmode]').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.vmode;
  document.querySelectorAll('[data-vmode]').forEach(x => x.classList.toggle('on', x === b));
  $('vs-guide').textContent = mode === 'face'
    ? '정면을 바라보고, 앞머리를 넘겨 이마가 보이게 찍어주세요. 밝은 곳에서 찍을수록 정확합니다.'
    : '손바닥을 펴서 카메라 정면에 두고, 손가락을 붙이지 말고 자연스럽게 벌려 찍어주세요.';
  $('vs-cam').setAttribute('capture', mode === 'face' ? 'user' : 'environment');
  clearPhoto();
}));
$('vs-cam').setAttribute('capture', 'user');

function clearPhoto() {
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = null;
  $('vs-photo').style.display = 'none';
  $('vs-result').style.display = 'none';
  $('vs-img').removeAttribute('src');
  status('');
}

async function loadModels() {
  if (!vision) {
    status('분석 모델을 불러오는 중... (처음 한 번만, 수 초 걸립니다)');
    const mp = await import(`${MP_URL}/vision_bundle.mjs`);
    vision = { mp, fileset: await mp.FilesetResolver.forVisionTasks(`${MP_URL}/wasm`) };
  }
  const { mp, fileset } = vision;
  if (mode === 'face' && !faceLM) {
    faceLM = await mp.FaceLandmarker.createFromOptions(fileset, { baseOptions: { modelAssetPath: FACE_MODEL }, runningMode: 'IMAGE', numFaces: 1 });
  }
  if (mode === 'hand' && !handLM) {
    handLM = await mp.HandLandmarker.createFromOptions(fileset, { baseOptions: { modelAssetPath: HAND_MODEL }, runningMode: 'IMAGE', numHands: 1 });
  }
}

async function onFile(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (!$('vs-agree').checked) { alert('사진 분석 동의에 먼저 체크해 주세요.'); return; }
  clearPhoto();
  objUrl = URL.createObjectURL(file);
  const img = $('vs-img');
  img.src = objUrl;
  await img.decode();
  $('vs-photo').style.display = 'block';
  try {
    await loadModels();
    status('분석 중...');
    if (mode === 'face') analyzeFace(img); else analyzeHand(img);
  } catch (err) {
    console.error(err);
    status('분석 모델을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');
  }
}
$('vs-cam').addEventListener('change', onFile);
$('vs-file').addEventListener('change', onFile);

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function drawPoints(img, pts, idxs, color) {
  const cv = $('vs-canvas');
  cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  const r = Math.max(3, cv.width / 160);
  ctx.fillStyle = color;
  idxs.forEach(i => { ctx.beginPath(); ctx.arc(pts[i].x * cv.width, pts[i].y * cv.height, r, 0, Math.PI * 2); ctx.fill(); });
  return ctx;
}

const ZONE_TEXT = {

function analyzeFace(img) {
  const res = faceLM.detect(img);
  if (!res.faceLandmarks || !res.faceLandmarks.length) { status('얼굴을 찾지 못했습니다. 정면 사진으로 다시 찍어주세요.'); return; }
  const p = res.faceLandmarks[0].map(q => ({ x: q.x * img.naturalWidth, y: q.y * img.naturalHeight }));
  const pn = res.faceLandmarks[0];
  // 10: 이마 위쪽(얼굴 메시 상단), 9: 미간, 2: 코 밑(인중 시작), 152: 턱 끝, 234·454: 양 광대
  // 메시 상단(10)은 실제 헤어라인보다 아래이므로 상정은 1.35배로 보정한 추정치
  const upper = dist(p[10], p[9]) * 1.35, middle = dist(p[9], p[2]), lower = dist(p[2], p[152]);
  const sum = upper + middle + lower;
  const pct = [upper, middle, lower].map(v => Math.round(v / sum * 100));
  const names = ['상정', '중정', '하정'];
  const top = names[pct.indexOf(Math.max(...pct))];
  const spread = Math.max(...pct) - Math.min(...pct);
  const width = dist(p[234], p[454]), height = dist(p[10], p[152]) + upper - dist(p[10], p[9]);
  const ratio = height / width;
  const shape = ratio > 1.45 ? '긴 얼굴형' : ratio < 1.25 ? '넓고 둥근 얼굴형' : '균형 잡힌 얼굴형';
  const shapeText = ratio > 1.45 ? '목표를 길게 보고 꾸준히 가는 기질로 봅니다.' : ratio < 1.25 ? '사람을 넉넉히 품고 현실 감각이 좋은 기질로 봅니다.' : '어느 한쪽으로 치우치지 않는 안정된 기질로 봅니다.';
  drawPoints(img, pn, [10, 9, 2, 152, 234, 454], '#F4D06F');
  status('');
  $('vs-result').innerHTML = `
    <div class="result-title">😊 관상 · 삼정(三停) 분석</div>
    <div class="ratio3">
      ${names.map((n, i) => `<div class="${n === top ? 'top3' : ''}"><div class="muted">${n}</div><div class="v">${pct[i]}%</div>
        <div class="muted">${['이마 · 초년', '눈썹~코 · 중년', '코~턱 · 말년'][i]}</div></div>`).join('')}
    </div>
    <div class="rc">
      <p>• ${spread <= 6 ? '삼정이 고르게 나뉜 균형 잡힌 상입니다. 초년·중년·말년의 운이 크게 치우치지 않는 것으로 봅니다.' : ZONE_TEXT[top]}</p>
      <p>• <b>${shape}</b> (세로/가로 ${ratio.toFixed(2)}) — ${shapeText}</p>
      <p class="muted">상정은 얼굴 인식 범위 밖인 헤어라인을 추정해 계산했습니다. 눈·코·입 부위별 세부 관상은 다음 버전에서 제공합니다. 사진은 저장되지 않았습니다.</p>
    </div>`;
  $('vs-result').style.display = 'block';
}

/* ---------- 손 모양 ---------- */
const HAND_TYPE = {
  흙: { title: '흙의 손 (네모 손바닥 + 짧은 손가락)', suit: '펜타클', text: '현실적이고 성실하며 손으로 직접 만드는 일에 강합니다. 말보다 결과로 보여주는 타입입니다.' },
  공기: { title: '공기의 손 (네모 손바닥 + 긴 손가락)', suit: '소드', text: '분석적이고 말과 글에 능합니다. 생각이 많고 소통과 정보를 다루는 일에 맞습니다.' },
  불: { title: '불의 손 (긴 손바닥 + 짧은 손가락)', suit: '완즈', text: '열정적이고 행동이 빠릅니다. 먼저 저지르고 보는 추진력과 리더십이 있습니다.' },
  물: { title: '물의 손 (긴 손바닥 + 긴 손가락)', suit: '컵', text: '감수성과 직관이 뛰어납니다. 사람의 감정을 잘 읽고 예술적 감각이 있습니다.' }
};
function analyzeHand(img) {
  const res = handLM.detect(img);
  if (!res.landmarks || !res.landmarks.length) { status('손을 찾지 못했습니다. 손바닥 전체가 나오게 다시 찍어주세요.'); return; }
  const pn = res.landmarks[0];
  const p = pn.map(q => ({ x: q.x * img.naturalWidth, y: q.y * img.naturalHeight }));
  // 손바닥 길이: 손목(0)~중지 뿌리(9) / 손바닥 폭: 검지 뿌리(5)~새끼 뿌리(17) / 중지 길이: 9→10→11→12
  const palmLen = dist(p[0], p[9]), palmW = dist(p[5], p[17]);
  const finger = dist(p[9], p[10]) + dist(p[10], p[11]) + dist(p[11], p[12]);
  const palmRatio = palmLen / palmW, fingerRatio = finger / palmLen;
  const square = palmRatio <= 1.3, longF = fingerRatio >= 0.85;
  const type = square ? (longF ? '공기' : '흙') : (longF ? '물' : '불');
  const T = HAND_TYPE[type];
  drawPoints(img, pn, [0, 5, 9, 10, 11, 12, 17], '#D8B4FE');
  status('');
  $('vs-result').innerHTML = `
    <div class="result-title">✋ 손 모양 · 4원소 손 유형</div>
    <div class="chips"><span class="chip">손바닥 세로/폭 ${palmRatio.toFixed(2)}</span><span class="chip">중지/손바닥 ${fingerRatio.toFixed(2)}</span></div>
    <div class="rc">
      <p><b>${escH(T.title)}</b></p>
      <p>• ${escH(T.text)}</p>
      <p>• 타로로는 <b>${T.suit}</b> 슈트의 기운과 통합니다.</p>
      <p class="muted">생명선·두뇌선·감정선 같은 손금 선 자동 판독은 준비 중입니다. 지금은 손 모양으로 기질을 봅니다. 사진은 저장되지 않았습니다.</p>
    </div>`;
  $('vs-result').style.display = 'block';
}

    const set = (id, v) => { const e = $(id); if (e && v != null && !e.dataset.touched) e.value = v; };
    set('sj-name', p.name); set('sj-date', p.date); set('sj-time', p.time); set('sj-city', p.city); set('sj-gender', p.gender);
    set('as-date', p.date); set('as-time', p.time); set('as-city', p.city);
    ['sj-notime', 'as-notime'].forEach(id => { const e = $(id); if (e && !e.dataset.touched) { e.checked = !!p.notime; const t = $(id.replace('notime', 'time')); if (t) t.disabled = !!p.notime; } });
    // 궁합: 내 쪽 기본값
    try {
      const mode = document.querySelector('[data-cmode].on').dataset.cmode;
      const s = mode === 'zodiac' ? signOf(natalChart(p.date, p.notime ? '' : p.time, p.city).sun) : withZone(p.city, p.date, p.notime ? '' : p.time, () => sajuPillars({ dateStr: p.date, timeStr: p.notime ? '' : p.time })).pillars.year.branch;
      if (!$('cp-a').dataset.touched) $('cp-a').value = String(s);
    } catch (e) { /* 무시 */ }
  }
  const ran = {};
  function autoRun(k) {
    const p = getP(); if (!p || ran[k]) return;
    if (k === 'saju' && p.gender) { ran.saju = true; $('sj-go').click(); }
    if (k === 'astro') { ran.astro = true; $('as-go').click(); }
  }
  function remember(src) {
    // 사주·별자리를 보면 그 정보를 내 정보로 기억
    if (getP()) return; // 이미 내 정보가 있으면 덮어쓰지 않기 (수정은 '내 정보'에서)
    const pre = src === 'saju' ? 'sj' : 'as', p = {};
    const date = $(pre + '-date').value; if (!date) return;
    const np = { ...p, date, time: $(pre + '-time').value, notime: $(pre + '-notime').checked, city: $(pre + '-city').value };
    if (src === 'saju') { np.gender = $('sj-gender').value || p.gender; np.name = $('sj-name').value.trim() || p.name; }
    setP(np); ran[src] = true; renderToday(); meLabel(); collapse();
  }
  function meLabel() { const p = getP(); $('mb-me').textContent = p ? `${p.name || '나'} · 내 정보` : '내 정보'; }
  function meSheet() {
    const p = getP() || {};
    const ov = document.createElement('div'); ov.id = 'mb-sheet'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', '내 정보');
    ov.innerHTML = `<form class="dict-box mb-me-form"><div class="dict-head"><b>내 정보</b><button type="button" data-close aria-label="닫기">✕</button></div>
      <p class="note">한 번 넣어두면 사주·별자리·오늘의 기운이 바로 나와요. 이 기기에만 저장돼요.</p>
      <div class="fg"><label for="me-name">이름 (선택)</label><input class="inp" id="me-name" maxlength="20" value="${esc(p.name || '')}"></div>
      <div class="row2"><div class="fg"><label for="me-date">생년월일 (양력)</label><input class="inp" type="date" id="me-date" min="1930-01-01" max="2030-12-31" value="${p.date || ''}" required></div>
        <div class="fg"><label for="me-time">태어난 시각</label><input class="inp" type="time" id="me-time" value="${p.time || ''}"${p.notime ? ' disabled' : ''}>
        <label class="chk"><input type="checkbox" id="me-notime"${p.notime ? ' checked' : ''}> 시간 모름</label></div></div>
      <div class="row2"><div class="fg"><label for="me-city">출생지</label><select class="inp" id="me-city">${$('sj-city').innerHTML}</select></div>
        <div class="fg"><label for="me-gender">성별</label><select class="inp" id="me-gender"><option value="">선택</option><option value="f">여성</option><option value="m">남성</option></select></div></div>
      <button class="btn-submit" type="submit">저장하기</button>
      ${getP() ? '<button type="button" class="mb-link" data-forget>내 정보 지우기</button>' : ''}</form>`;
    document.body.appendChild(ov);
    $('me-city').value = p.city || 'seoul'; $('me-gender').value = p.gender || '';
    $('me-notime').addEventListener('change', e => { $('me-time').disabled = e.target.checked; });
    const close = () => ov.remove();
    ov.addEventListener('click', e => {
      if (e.target === ov || e.target.closest('[data-close]')) close();
      if (e.target.closest('[data-forget]')) { try { localStorage.removeItem(PKEY); } catch (x) { /* 무시 */ } Object.keys(ran).forEach(k => delete ran[k]); collapse(); meLabel(); renderToday(); close(); }
    });
    ov.querySelector('form').addEventListener('submit', e => {
      e.preventDefault();
      if (!$('me-date').value) { $('me-date').focus(); return; }
      setP({ name: $('me-name').value.trim(), date: $('me-date').value, time: $('me-time').value, notime: $('me-notime').checked, city: $('me-city').value, gender: $('me-gender').value });
      ['sj-date', 'sj-time', 'sj-city', 'sj-gender', 'sj-name', 'sj-notime', 'as-date', 'as-time', 'as-city', 'as-notime'].forEach(id => { const el = $(id); if (el) delete el.dataset.touched; });
      Object.keys(ran).forEach(k => delete ran[k]); ['saju', 'astro'].forEach(k => delete $('tab-' + k).dataset.open); fillForms(); collapse(); meLabel(); renderToday(); close();
      if ($('tab-fate').classList.contains('active')) autoRun(fateSub);
    });
    setTimeout(() => $('me-date').focus(), 50);
  }

  /* ---------- 홈 아래 한 줄: 오늘의 기운 ---------- */
  function renderToday() {
    const p = getP(), el = $('mb-today'); if (!el) return;
    if (!p) { el.innerHTML = '<button type="button" class="mb-link" data-more="me">생일을 넣으면 매일 내 사주로 오늘의 기운을 알려드려요</button>'; return; }
    try {
      const d = new Date(), ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const today = sajuPillars({ dateStr: ds, timeStr: '12:00' }).pillars.day;
      const me = withZone(p.city, p.date, p.notime ? '' : p.time, () => sajuPillars({ dateStr: p.date, timeStr: p.notime ? '' : p.time })).pillars.day;
      const god = tenGod(me.stem, today.stem);
      el.innerHTML = `<b>${esc(p.name || '나')}의 오늘</b> · ${today.ko}(${today.han})일 · ${esc(DAY_GOD[god] || '')} <span>행운의 색 ${LUCKY[STEM_EL[today.stem]]}</span>`;
    } catch (e) { el.textContent = ''; }
  }

  /* ---------- 기록 탭 ---------- */
  function renderRecords() {
    const box = $('mb-records');
    box.innerHTML = TP.recordsHtml();
  }

  /* ---------- 이벤트 ---------- */
  function bind() {
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-tab]'); if (t && t.closest('.mb-nav')) { if (t.dataset.tab === 'home') home(); else show(t.dataset.tab); return; }
      const g = e.target.closest('[data-go]'); if (g) { if (g.dataset.go === 'home') home(); else show(g.dataset.go); return; }
      const q = e.target.closest('[data-quick]');
      if (q) { const k = q.dataset.quick; if (k === 'daily') toChat(() => TP.daily()); else openFate(k); return; }
      const f = e.target.closest('[data-fsub]'); if (f) { subShow(f.dataset.fsub); return; }
      const m = e.target.closest('[data-more]');
      if (m) { const k = m.dataset.more; if (k === 'me') meSheet(); else if (k === 'vision') openVision(); else if (k === 'dict') TP.dict(); else if (k === 'yesno') toChat(() => TP.yesno()); return; }
      const o = e.target.closest('[data-other]');
      if (o) { const sec = o.closest('.section'); sec.dataset.open = '1'; sec.classList.remove('mb-collapsed'); o.closest('.mb-sum').remove(); sec.querySelectorAll('.inp').forEach(x => { x.dataset.touched = '1'; }); const d = sec.querySelector('input[type=date]'); if (d) d.focus(); return; }
      if (e.target.closest('#mb-me')) meSheet();
    });
    $('mb-form').addEventListener('submit', e => { e.preventDefault(); const q = $('mb-input').value.trim(); if (q) ask(q); else $('mb-input').focus(); });
    // 사용자가 직접 고친 칸은 내 정보로 덮어쓰지 않기
    ['sj-name', 'sj-date', 'sj-time', 'sj-city', 'sj-gender', 'sj-notime', 'as-date', 'as-time', 'as-city', 'as-notime', 'cp-a'].forEach(id => { const el = $(id); if (el) el.addEventListener('input', () => { el.dataset.touched = '1'; }); });
    $('sj-go').addEventListener('click', () => setTimeout(() => { if ($('sj-result').style.display !== 'none') remember('saju'); }, 0));
    $('as-go').addEventListener('click', () => setTimeout(() => { if ($('as-result').style.display !== 'none') remember('astro'); }, 0));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { const s = $('mb-sheet'); if (s) s.remove(); } });
    // 예시 질문 돌려 보여주기
    const ex = ['그 사람 속마음이 궁금해', '이직해도 괜찮을까?', '이번 시험 붙을까?', '올해 돈 흐름은?', '우리 다시 연락할 수 있을까?'];
    let i = 0; setInterval(() => { const inp = $('mb-input'); if (inp && document.activeElement !== inp && !inp.value) { i = (i + 1) % ex.length; inp.placeholder = ex[i]; } }, 3500);
  }

  build(); bind(); meLabel(); renderToday(); fillForms(); show('home');
  return { home, show, openFate, ask };
})();

</script>
<script>
/* =========================================================
 * 베타 모드 (2026-11-15)
 *  - 설정은 사이트 맨 위 config.js 한 곳 (window.RODEO_CONFIG)
 *  - 유료 버튼: 누른 횟수(결제 의향)를 기록하고 베타 기간에는 무료로 열기
 *  - 방문 분석: 구글 애널리틱스(GA4) 측정 ID가 있으면 이벤트 전송
 *  - 의견 보내기: 구글 폼·카카오 오픈채팅 주소가 있으면 버튼 표시
 * ========================================================= */
const BETA = (() => {
  const CFG = Object.assign({ BETA: true, GA_ID: '', FEEDBACK_URL: '', EN_URL: '' }, window.RODEO_CONFIG || {});
  // 구글 애널리틱스 연결
  if (CFG.GA_ID) {
    const s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(CFG.GA_ID);
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || []; window.gtag = function () { window.dataLayer.push(arguments); };
    gtag('js', new Date()); gtag('config', CFG.GA_ID, { anonymize_ip: true });
  }
  function track(name, props) {
    try { if (window.gtag && CFG.GA_ID) window.gtag('event', name, props || {}); } catch (e) { /* 분석 실패는 무시 */ }
  }
  function toast(msg) {
    let t = document.getElementById('beta-toast');
    if (!t) { t = document.createElement('div'); t.id = 'beta-toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600);
  }
  // 유료 버튼 = 결제 의향 측정 (가짜 결제 아님: 누르면 바로 베타 무료라고 알려줌)
  function pay(product, unlock) {
    track('pay_click', { product });
    if (CFG.BETA) { toast('베타 기간이라 무료로 열어드려요 🎁'); setTimeout(unlock, 500); }
    else unlock(); // TODO: 정식 결제 연결
  }
  if (CFG.BETA && typeof FREEBIE !== 'undefined') FREEBIE.available = () => false; // 베타 땐 카카오 무료 버튼 숨김

  /* 화면 손질 */
  const logo = document.querySelector('.mb-logo');
  if (logo && CFG.BETA) logo.insertAdjacentHTML('afterend', '<span class="mb-beta">베타</span>');
  const list = document.querySelector('.mb-list');
  if (list) {
    if (CFG.FEEDBACK_URL) list.insertAdjacentHTML('beforeend', `<a class="mb-row" href="${CFG.FEEDBACK_URL}" target="_blank" rel="noopener" data-track="feedback_open"><b>의견 보내기</b><span>불편한 점, 맞았던 점 다 좋아요. 베타를 함께 만들어요</span></a>`);
    if (CFG.EN_URL) list.insertAdjacentHTML('beforeend', `<a class="mb-row" href="${CFG.EN_URL}" data-track="open_en"><b>English · Korean Saju</b><span>외국인 친구에게 공유하기 좋은 영어 사주 페이지</span></a>`);
  }

  /* 이벤트 기록 */
  if (typeof selectQuestion === 'function') {
    const _sq = selectQuestion;
    selectQuestion = function (q) { track('question_asked', { topic: (typeof topicKey === 'function' && topicKey(q)) || 'general' }); return _sq.apply(this, arguments); };
  }
  if (typeof unlockFinal === 'function') {
    const _uf = unlockFinal;
    unlockFinal = function () { track('reading_unlocked', { spread: (typeof layout !== 'undefined' && layout.key) || '' }); return _uf.apply(this, arguments); };
  }
  const CLICK = [
    ['[data-save-img]', 'image_save'], ['[data-share]', 'share'], ['[data-quick]', e => 'quick_' + e.dataset.quick],
    ['[data-more]', e => 'more_' + e.dataset.more], ['.mb-nav [data-tab]', e => 'tab_' + e.dataset.tab],
    ['#sj-go', 'saju_view'], ['#as-go', 'astro_view'], ['#cp-go', 'compat_view'], ['[data-dcard]', 'dict_card'], ['[data-track]', e => e.dataset.track]
  ];
  document.addEventListener('click', e => {
    if (!e.isTrusted) return; // 화면 다시 그리기용 자동 클릭은 세지 않기
    for (const [sel, name] of CLICK) { const el = e.target.closest(sel); if (el) { track(typeof name === 'function' ? name(el) : name); break; } }
    const f = e.target.closest('[data-feel]');
    if (f) {
      track('feedback_feel', { feel: ['hit', 'half', 'miss'][Number(f.dataset.feel)] });
      if (CFG.FEEDBACK_URL && f.dataset.feel === '2') setTimeout(() => botMsg(`아쉬웠던 점을 알려주시면 베타에 바로 반영할게요. <a class="mb-link" href="${CFG.FEEDBACK_URL}" target="_blank" rel="noopener">의견 보내기</a>`), 300);
    }
  }, true);
  ['vs-cam', 'vs-file'].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener('change', () => track('vision_photo')); });
  track('app_open', { profile: (() => { try { return localStorage.getItem('rodeo_profile_v1') ? 'yes' : 'no'; } catch (e) { return 'na'; } })() });
  return { pay, track, toast, CFG };
})();

</script>
